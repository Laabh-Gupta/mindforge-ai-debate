services:
  mindforge:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/mindforge.sqlite
    ports:
      - "3000:3000"
    volumes:
      - mindforge-data:/app/data
    restart: unless-stopped
volumes:
  mindforge-data:
